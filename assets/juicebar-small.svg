<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Pixel-aligned version of the Juice Bar icon for 16-24 px: no bolt or shadow, thicker shell. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFBFD"/>
      <stop offset="1" stop-color="#C9D1DC"/>
    </linearGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BF07A"/>
      <stop offset="1" stop-color="#18A85E"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="3.5" width="13" height="9" rx="2.5" fill="url(#shell)" stroke="#6F7988"/>
  <rect x="13.5" y="6" width="2" height="4" rx="0.8" fill="#6F7988"/>
  <rect x="2" y="5" width="7" height="6" rx="1.2" fill="url(#juice)"/>
</svg>
