<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Juice Bar app icon. tools/make-icon.ps1 renders the .ico from this geometry
       (with a simplified version for 16-24 px, see assets/juicebar-small.svg). -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFBFD"/>
      <stop offset="1" stop-color="#C9D1DC"/>
    </linearGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BF07A"/>
      <stop offset="1" stop-color="#18A85E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="12" y="58" width="208" height="140" rx="38" fill="url(#shell)" stroke="#7D8796" stroke-width="4"/>
    <rect x="224" y="100" width="24" height="56" rx="10" fill="#AEB7C4" stroke="#7D8796" stroke-width="4"/>
  </g>
  <rect x="34" y="80" width="138" height="96" rx="22" fill="url(#juice)"/>
  <path d="M112 90 L78 134 H102 L92 168 L136 120 H111 L124 90 Z" fill="#FFFFFF"/>
</svg>
