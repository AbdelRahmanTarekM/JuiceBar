name: Bug report
description: Something doesn't work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Juice Bar version
      description: Settings > General shows it.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` to see it.
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Recent lines from %APPDATA%\JuiceBar\juicebar.log, if any. Remove personal device names.
      render: text
