name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check version matches tag
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/BFM/BFM.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Project version $v does not match tag ${{ github.ref_name }}" }
      - name: Publish
        shell: pwsh
        run: ./tools/publish.ps1

      # Signing runs once the SignPath project exists: set the repository variables SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG and the secret SIGNPATH_API_TOKEN.
      # Each request waits for a maintainer to approve it in SignPath.
      - name: Upload unsigned exe for signing
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: JuiceBar-unsigned
          path: dist/JuiceBar.exe
          archive: false
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
          skip-decompress: true
      - name: Use signed exe and refresh its checksum
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $signed -or (Get-AuthenticodeSignature $signed.FullName).Status -ne 'Valid') { throw "No validly signed exe returned" }
          Copy-Item $signed.FullName dist/JuiceBar.exe -Force
          $hash = (Get-FileHash dist/JuiceBar.exe -Algorithm SHA256).Hash
          Set-Content dist/JuiceBar.exe.sha256 "$hash  JuiceBar.exe" -NoNewline -Encoding ascii

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JuiceBar.exe
            dist/JuiceBar.exe.sha256
          generate_release_notes: true
